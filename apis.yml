apis:
- aid: swift:swift-gpi-api
  name: SWIFT GPI API
  description: >-
    The SWIFT GPI (Global Payments Innovation) API enables financial institutions to track cross-border
    payment transactions in real time, update payment statuses, and manage stop-and-recall requests. Uses
    Unique End-to-End Transaction Reference (UETR) for tracking. Requires OAuth 2.0 authentication via
    JWT-Bearer grant type (RFC 7523).
  humanURL: https://developer.swift.com/apis/gpi-apis
  baseURL: https://api.swift.com/swift-apigateway
  properties:
  - type: Documentation
    url: https://developer.swift.com/apis/gpi-apis
  tags:
  - Cross-Border Payments
  - GPI
  - ISO 20022
  - Payment Tracking
  - Payments
  - UETR
- aid: swift:payment-pre-validation-api
  name: Payment Pre-validation API
  description: >-
    The SWIFT Payment Pre-validation API allows financial institutions and PSPs to verify payment instruction
    data against reference data and counterparty information before executing a payment. Checks account
    numbers, country codes, routing information, and beneficiary account validity to reduce failed payments.
  humanURL: https://developer.swift.com/apis/payment-pre-validation-api
  tags:
  - Compliance
  - Payment Pre-validation
  - Payments
  - Risk Management
  - Straight-Through Processing
  properties:
  - type: Documentation
    url: https://developer.swift.com/apis/payment-pre-validation-api
  - type: ProductPage
    url: https://www.swift.com/products/payment-pre-validation
- aid: swift:transaction-screening-api
  name: Transaction Screening API
  description: >-
    The SWIFT Transaction Screening API enables financial institutions to submit transactions to the SWIFT
    Transaction Screening Service (TSS) for sanctions and compliance screening before processing. Returns
    screening results with match details.
  humanURL: https://developer.swift.com/
  tags:
  - AML
  - Compliance
  - Payments
  - Sanctions Screening
  - Transaction Screening
  properties: []
