arazzo: 1.0.1
info:
  title: 'swift through revolut: addCounterparty preconfigured with swift'
  summary: Calls revolut's addCounterparty with `swift` preset, the way swift is used inside revolut.
  description: 'A PRECONFIGURATION, not an orchestration: swift is a banking-partner inside revolut, so the integration
    is revolut''s own operation with swift''s enum value set. Derived from revolut''s contract (revolut-counterparties-api-openapi.yml);
    required properties are inputs.'
  version: 1.0.0
x-integration:
  partner: revolut
  relationship: banking-partner
  preconfig: true
  edge_evidence: https://github.com/api-evangelist/revolut/blob/main/openapi/revolut-counterparties-api-openapi.yml
  edge_type: contract
  preset:
    route: swift
  method: derived
  generated: '2026-10-12'
  generator: build-integration-preconfigs.py
sourceDescriptions:
- name: revolutCounterpartiesApiOpenapi
  url: https://raw.githubusercontent.com/api-evangelist/revolut/refs/heads/main/openapi/revolut-counterparties-api-openapi.yml
  type: openapi
workflows:
- workflowId: swift-via-revolut-addcounterparty
  summary: addCounterparty with swift preset
  inputs:
    type: object
    required: []
    properties: {}
  steps:
  - stepId: call-with-preset
    operationId: $sourceDescriptions.revolutCounterpartiesApiOpenapi.addCounterparty
    requestBody:
      contentType: application/json
      payload:
        route: swift
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      id: $response.body#/id
  outputs:
    id: $steps.call-with-preset.outputs.id
